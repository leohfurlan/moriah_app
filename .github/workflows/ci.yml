name: CI

# Roda a suite do backend, tipos e regressões do mobile a cada push/PR.
# Sem isso os testes so rodam quando alguem lembra de rodar localmente.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # A suite usa config.settings_test (SQLite em memoria), entao nao
      # precisa de um servico Postgres aqui.
      - name: Rodar testes
        run: python -m pytest -q

      # Falha se alguma view quebrar a introspeccao do schema (nao falha
      # por warnings, hoje limitados a nomes de enum).
      - name: Validar schema da API
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py spectacular --file /dev/null

      - name: Checagem de deploy do Django
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py check

  mobile:
    name: Mobile (typecheck e regressões)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Regressões de notificações e extrato
        env:
          TZ: America/Sao_Paulo
        run: npm test

  finance-postgres:
    name: Fluxos operacionais (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moriah
          POSTGRES_USER: moriah
          POSTGRES_PASSWORD: moriah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moriah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: moriah
      POSTGRES_USER: moriah
      POSTGRES_PASSWORD: moriah
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest apps/finance/tests apps/schedules/tests apps/audit/tests -q --ds=config.settings_test_postgres
