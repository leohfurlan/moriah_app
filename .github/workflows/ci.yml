name: CI

# Roda a suite do backend, tipos e regressões do mobile a cada push/PR.
# Sem isso os testes so rodam quando alguem lembra de rodar localmente.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # A suite usa config.settings_test (SQLite em memoria), entao nao
      # precisa de um servico Postgres aqui.
      - name: Rodar testes
        run: python -m pytest -q

      # Falha se alguma view quebrar a introspeccao do schema (nao falha
      # por warnings, hoje limitados a nomes de enum).
      - name: Validar schema da API
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py spectacular --file /dev/null

      - name: Checagem de deploy do Django
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py check

  mobile:
    name: Mobile (typecheck e regressões)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Regressões de notificações e extrato
        env:
          TZ: America/Sao_Paulo
        run: npm test

  finance-postgres:
    name: Fluxos operacionais (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moriah
          POSTGRES_USER: moriah
          POSTGRES_PASSWORD: moriah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moriah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: moriah
      POSTGRES_USER: moriah
      POSTGRES_PASSWORD: moriah
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest apps/finance/tests apps/schedules/tests apps/audit/tests -q --ds=config.settings_test_postgres

  # Guardas de deploy: roda o `check --deploy` do Django com um ambiente igual
  # ao do piloto (fora do debug, banco remoto com TLS, S3, HTTPS). Se faltar
  # qualquer configuracao obrigatoria, o job falha antes de subir nada.
  guardas-de-deploy:
    name: Guardas de deploy (check --deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores descartaveis: aqui o objetivo e provar que a configuracao do
      # piloto passa nas checagens, nao conectar em nada.
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-descartavel-nao-use-em-producao-9f2c7a1d4b8e6503
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: piloto.moriah.app
      POSTGRES_HOST: ep-piloto-ci.neon.tech
      POSTGRES_SSLMODE: require
      POSTGRES_CONN_MAX_AGE: "60"
      POSTGRES_DB: moriah
      POSTGRES_USER: moriah
      POSTGRES_PASSWORD: descartavel-ci
      USE_S3_STORAGE: "true"
      S3_BUCKET_NAME: moriah-ci
      S3_REGION_NAME: sa-east-1
      S3_ACCESS_KEY_ID: descartavel
      S3_SECRET_ACCESS_KEY: descartavel
      CORS_ALLOWED_ORIGINS: https://app.moriah.app
      CSRF_TRUSTED_ORIGINS: https://app.moriah.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: check --deploy
        run: python manage.py check --deploy

  # Sobe a stack de piloto (imagem de producao + Postgres descartavel) e bate
  # nos endpoints de saude e nos estaticos: e o que garante que a imagem builda,
  # migra, sobe com gunicorn e responde antes de existir um servidor de verdade.
  stack-de-piloto:
    name: Stack de piloto (build, health e estaticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar .env.pilot do CI
        run: |
          {
            echo "DJANGO_SECRET_KEY=ci-$(openssl rand -hex 32)"
            echo "DJANGO_DEBUG=false"
            # TLS fica no proxy do piloto; no runner nao ha certificado.
            echo "DJANGO_SECURE_SSL_REDIRECT=false"
            echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend"
            echo "POSTGRES_DB=moriah"
            echo "POSTGRES_USER=moriah"
            echo "POSTGRES_PASSWORD=moriah"
            echo "POSTGRES_HOST=db"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_SSLMODE=disable"
            echo "POSTGRES_CONN_MAX_AGE=0"
            echo "USE_S3_STORAGE=false"
            echo "APP_REVISION=${GITHUB_SHA::12}"
            echo "PILOT_BIND=127.0.0.1"
          } > .env.pilot

      - name: Subir banco e rodar as migracoes
        run: |
          COMPOSE="docker compose -f docker-compose.pilot.yml -f docker-compose.ci.yml --env-file .env.pilot"
          $COMPOSE up -d db
          $COMPOSE --profile tools run --rm migrate

      - name: Subir a aplicacao
        run: |
          docker compose -f docker-compose.pilot.yml -f docker-compose.ci.yml --env-file .env.pilot up -d backend

      - name: Esperar /health/ responder
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health/ nao respondeu em 60s"
          docker compose -f docker-compose.pilot.yml -f docker-compose.ci.yml --env-file .env.pilot logs backend
          exit 1

      - name: Conferir saude, estaticos e revisao
        run: |
          echo "--- /health/"
          curl -fsS http://127.0.0.1:8000/health/ | tee /tmp/health.json
          grep -q 'ok' /tmp/health.json
          echo "--- /health/ready/ (depende do banco)"
          curl -fsS http://127.0.0.1:8000/health/ready/ | tee /tmp/ready.json
          grep -q 'ready' /tmp/ready.json
          echo "--- estatico do admin (whitenoise)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/static/admin/css/base.css)
          echo "HTTP $CODE em /static/admin/css/base.css"
          test "$CODE" = "200"

      - name: check --deploy dentro do container
        run: |
          docker compose -f docker-compose.pilot.yml -f docker-compose.ci.yml --env-file .env.pilot \
            exec -T backend python manage.py check --deploy

      - name: Logs do container (se algo falhou)
        if: failure()
        run: |
          docker compose -f docker-compose.pilot.yml -f docker-compose.ci.yml --env-file .env.pilot logs --tail 200

