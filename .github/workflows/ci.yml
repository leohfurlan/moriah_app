name: CI

# Roda a suite do backend e a checagem de tipos do mobile a cada push/PR.
# Sem isso os testes so rodam quando alguem lembra de rodar localmente.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # A suite usa config.settings_test (SQLite em memoria), entao nao
      # precisa de um servico Postgres aqui.
      - name: Rodar testes
        run: python -m pytest -q

      # Falha se alguma view quebrar a introspeccao do schema (nao falha
      # por warnings, hoje limitados a nomes de enum).
      - name: Validar schema da API
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py spectacular --file /dev/null

      - name: Checagem de deploy do Django
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py check

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck
