{% extends "admin/login.html" %}
{% block content %}
<div id="content-main">
  {{ form.non_field_errors }}
  <p>Configure o autenticador no aplicativo Moriah antes de acessar este painel.</p>
  <form action="{{ app_path }}" method="post" id="login-form">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="submit-row"><input type="submit" value="Entrar"></div>
  </form>
</div>
{% endblock %}
