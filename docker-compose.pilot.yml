# Stack de piloto / homologacao.
#
# O que muda em relacao ao docker-compose.yml (dev):
#   - sem o servico `db`: o banco e gerenciado (Neon) e vem por POSTGRES_*;
#   - sem o servico `mobile`: o app web e publicado no host/CDN, nao no piloto;
#   - gunicorn + whitenoise (Dockerfile.prod), sem volume de codigo;
#   - migracao explicita, em um servico separado que nao sobe sozinho;
#   - healthcheck sem consulta ao banco em /health/ e log com rotacao.
#
# Uso:
#   cp .env.example .env.pilot   # preencher (nunca commitar)
#   docker compose -f docker-compose.pilot.yml --env-file .env.pilot build
#   docker compose -f docker-compose.pilot.yml --env-file .env.pilot run --rm migrate
#   docker compose -f docker-compose.pilot.yml --env-file .env.pilot up -d backend
#
# Rollback: subir a tag anterior da imagem (ver docs/runbook-deploy-piloto.md).

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
    args:
      # Aparece em /health/ para saber qual commit esta no ar.
      APP_REVISION: ${APP_REVISION:-unknown}
  image: ${PILOT_IMAGE:-moriah-backend}:${APP_REVISION:-latest}
  # Allowlist: --env-file is interpolation input, never a container env_file.
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique application secret}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
    DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-false}
    DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    DJANGO_DB_LOG_LEVEL: ${DJANGO_DB_LOG_LEVEL:-WARNING}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    POSTGRES_DB: ${POSTGRES_DB:-moriah}
    POSTGRES_USER: ${POSTGRES_USER:-moriah_app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the application database password}
    POSTGRES_HOST: ${POSTGRES_HOST:-db}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
    POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
    POSTGRES_CONN_HEALTH_CHECKS: ${POSTGRES_CONN_HEALTH_CHECKS:-true}
    USE_S3_STORAGE: ${USE_S3_STORAGE:-false}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_REGION_NAME: ${S3_REGION_NAME:-auto}
    S3_URL_EXPIRE_SECONDS: ${S3_URL_EXPIRE_SECONDS:-900}
    PRIVATE_LOCAL_MEDIA: ${PRIVATE_LOCAL_MEDIA:-false}
    LOCAL_MEDIA_PERSISTENT: ${LOCAL_MEDIA_PERSISTENT:-false}
    LOCAL_MEDIA_URL_EXPIRE_SECONDS: ${LOCAL_MEDIA_URL_EXPIRE_SECONDS:-900}
    WHATSAPP_AUTH_ENABLED: ${WHATSAPP_AUTH_ENABLED:-false}
    WHATSAPP_AUTH_CHURCH_ID: ${WHATSAPP_AUTH_CHURCH_ID:-0}
    WHATSAPP_TRUST_CLIENT_IP: ${WHATSAPP_TRUST_CLIENT_IP:-false}
    EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    AUTH_TRUST_CLIENT_IP: ${AUTH_TRUST_CLIENT_IP:-false}
    MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set a separate Fernet key}
    JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-10}
    JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    TIME_ZONE: ${TIME_ZONE:-America/Sao_Paulo}
    CORA_ENABLED: ${CORA_ENABLED:-false}
    CORA_CHURCH_ID: ${CORA_CHURCH_ID:-0}
    CORA_ENVIRONMENT: ${CORA_ENVIRONMENT:-stage}
    CORA_BASE_URL: ${CORA_BASE_URL:-https://matls-clients.api.stage.cora.com.br}
    CORA_CLIENT_ID: ${CORA_CLIENT_ID:-}
    CORA_CERT_PATH: ${CORA_CERT_PATH:-}
    CORA_KEY_PATH: ${CORA_KEY_PATH:-}
    CORA_RECIPIENT_NAME: ${CORA_RECIPIENT_NAME:-}
    CORA_DATA_KEY: ${CORA_DATA_KEY:-}
    TALK2ME_DIRECTORY_TOKEN: ${TALK2ME_DIRECTORY_TOKEN:-}
    TALK2ME_DIRECTORY_CHURCH_ID: ${TALK2ME_DIRECTORY_CHURCH_ID:-0}

services:
  # Migracao explicita: `profiles: [tools]` impede que ela suba junto com o
  # `up -d backend` (schema nunca muda por acidente em um restart).
  migrate:
    <<: *backend-common
    profiles: ["tools"]
    command: python manage.py migrate --noinput
    restart: "no"

  backend:
    <<: *backend-common
    # Sem `command`: a propria imagem ja sobe o gunicorn com os defaults e
    # aceita GUNICORN_WORKERS/THREADS/TIMEOUT/PORT por variavel de ambiente.
    # 127.0.0.1 por padrao: quem fala HTTPS com a internet e o proxy (Caddy/nginx)
    # na frente. Troque para 0.0.0.0 apenas se o proxy estiver em outro host.
    ports:
      - "${PILOT_BIND:-127.0.0.1}:${PILOT_PORT:-8000}:8000"
    healthcheck:
      # Liveness nao mantem o Neon ativo. Readiness e conferido no deploy.
      # Unhealthy sinaliza falha; restart policy atua quando o processo sai.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Proxy HTTPS opcional (perfil `proxy`). Sirva o Caddyfile de exemplo e aponte
  # o DNS do piloto para este host.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
